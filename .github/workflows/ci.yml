name: ci

on:
  push:
    branches: [bigbrother]
  pull_request:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 nodejs

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Audit anti-detection surface
        run: ./scripts/checksec.sh

      - name: Package artefact
        uses: actions/upload-artifact@v4
        with:
          name: oicq-linux-x86_64
          path: build/oicq.so
          if-no-files-found: error
